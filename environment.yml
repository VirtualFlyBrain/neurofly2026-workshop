# Conda environment for the VFB NeuroFly 2026 workshop (self-host / local).
# Versions mirror requirements.txt — see the comments there.
name: vfb-workshop-2026
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - jupyterlab
  - pandas>=2.2
  - seaborn>=0.13
  - matplotlib>=3.8
  - ipywidgets>=8.1
  - plotly>=6.0
  - pip:
      - vfb_connect==2.3.14
      - navis==1.12.0
      - flybrains==0.6.3
      - neuprint-python==0.6.3
      - python-catmaid==2.4.2
      - jsonpath_rw==1.4.0
