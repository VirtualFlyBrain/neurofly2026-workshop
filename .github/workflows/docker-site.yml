name: Docker Site CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_IMAGE: virtualflybrain/vfb-workshop-site

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract version from ref
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=${GITHUB_REF#refs/heads/}
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Built version: ${VERSION}"

    - name: Build Docker image (multi-arch)
      run: |
        docker buildx build . \
          --file Dockerfile.site \
          --platform linux/amd64,linux/arm64 \
          --tag ${DOCKER_IMAGE}:${{ steps.version.outputs.version }} \
          --tag ${DOCKER_IMAGE}:latest \
          --push

    - name: Verify build
      run: |
        # For multi-arch builds, image won't be in local registry
        echo "Multi-arch build pushed to Docker Hub"

    - name: Login to Docker Hub
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Push to Docker Hub
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
      run: |
        docker push ${DOCKER_IMAGE}:${{ steps.version.outputs.version }}
        docker push ${DOCKER_IMAGE}:latest
        echo "Pushed ${DOCKER_IMAGE}:${{ steps.version.outputs.version }}"
        echo "Pushed ${DOCKER_IMAGE}:latest"

    - name: Create build summary
      if: always()
      run: |
        echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${DOCKER_IMAGE}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ job.status }}" == "success" ]; then
          echo "✓ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          if [[ $GITHUB_REF == refs/heads/main* ]] || [[ $GITHUB_REF == refs/heads/master* ]] || [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "✓ Image pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ PR build - image not pushed" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "✗ Build failed" >> $GITHUB_STEP_SUMMARY
        fi
