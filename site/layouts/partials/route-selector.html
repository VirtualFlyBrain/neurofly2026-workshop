<style>
.route-selector {
  position: sticky;
  top: var(--nav-h);
  z-index: 80;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--line-soft);
  padding: var(--sp-3) 0;
}

.route-selector__inner {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  flex-wrap: wrap;
}

.route-selector__label {
  font-family: var(--font-mono);
  font-size: .72rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
  flex-shrink: 0;
}

.route-selector__buttons {
  display: flex;
  gap: var(--sp-2);
  flex-wrap: wrap;
}

.route-selector__btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-4);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--text-dim);
  font-family: var(--font-body);
  font-size: .885rem;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s var(--ease);
}

.route-selector__btn:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--line);
  transform: translateY(-1px);
}

.route-selector__btn--active {
  background: var(--grad-brand);
  color: #05070e;
  border-color: transparent;
  font-weight: 650;
  box-shadow: var(--glow);
}

.route-selector__btn--python.route-selector__btn--active {
  background: linear-gradient(115deg, rgba(59,130,246,.9) 0%, rgba(37,99,235,.9) 100%);
  color: #fff;
}

.route-selector__btn--r.route-selector__btn--active {
  background: linear-gradient(115deg, rgba(20,184,166,.9) 0%, rgba(13,148,136,.9) 100%);
  color: #fff;
}

.route-selector__btn--mcp.route-selector__btn--active {
  background: linear-gradient(115deg, rgba(236,72,153,.9) 0%, rgba(219,39,119,.9) 100%);
  color: #fff;
}

.route-selector__btn--chat.route-selector__btn--active {
  background: linear-gradient(115deg, rgba(34,197,94,.9) 0%, rgba(22,163,74,.9) 100%);
  color: #fff;
}

.route-selector__btn--browser.route-selector__btn--active {
  background: linear-gradient(115deg, rgba(251,146,60,.9) 0%, rgba(234,88,12,.9) 100%);
  color: #fff;
}

.route-selector__icon {
  width: 1.1rem;
  height: 1.1rem;
  flex-shrink: 0;
}

@media (max-width: 768px) {
  .route-selector__inner {
    justify-content: center;
  }
  
  .route-selector__label {
    width: 100%;
    text-align: center;
    margin-bottom: var(--sp-2);
  }
  
  .route-selector__buttons {
    justify-content: center;
  }
  
  .route-selector__btn {
    padding: var(--sp-2) var(--sp-3);
    font-size: .8rem;
  }
  
  .route-selector__btn span {
    display: none;
  }
}
</style>

<script>
(function() {
  const STORAGE_KEY = 'vfb-workshop-route';
  const defaultRoute = 'python';
  
  function getStoredRoute() {
    try {
      return localStorage.getItem(STORAGE_KEY) || defaultRoute;
    } catch (e) {
      return defaultRoute;
    }
  }
  
  function setStoredRoute(route) {
    try {
      localStorage.setItem(STORAGE_KEY, route);
    } catch (e) {}
  }
  
  function updateRouteDisplay(route) {
    document.querySelectorAll('.route-selector__btn').forEach(btn => {
      btn.classList.remove('route-selector__btn--active');
      if (btn.dataset.route === route) {
        btn.classList.add('route-selector__btn--active');
      }
    });
    
    document.querySelectorAll('[data-route-content]').forEach(el => {
      el.style.display = el.dataset.routeContent === route ? 'block' : 'none';
    });
  }
  
  function init() {
    const params = new URLSearchParams(window.location.search);
    const urlRoute = params.get('route');
    const valid = Array.from(document.querySelectorAll('.route-selector__btn')).map(b => b.dataset.route);
    const startRoute = (urlRoute && valid.includes(urlRoute)) ? urlRoute : getStoredRoute();
    if (urlRoute && valid.includes(urlRoute)) setStoredRoute(urlRoute);
    updateRouteDisplay(startRoute);
    
    document.querySelectorAll('.route-selector__btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const route = btn.dataset.route;
        setStoredRoute(route);
        updateRouteDisplay(route);
        try {
          const u = new URL(window.location);
          u.searchParams.set('route', route);
          history.replaceState(null, '', u);
        } catch (e) {}
        
        const firstContent = document.querySelector(`[data-route-content="${route}"]`);
        if (firstContent) {
          firstContent.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
