{{ define "main" }}
<div class="doc">
  <article class="doc__main">
    <ul class="breadcrumb">
      <li><a href="{{ .Site.BaseURL }}">Home</a></li>
      <li>{{ .Title }}</li>
    </ul>
    
    <header class="doc__header">
      <h1>{{ .Title }}</h1>
      <p class="lede">{{ .Description }}</p>
    </header>
    
    <div class="prose">
      {{ .Content }}
    </div>
    
    <div class="card-grid" style="margin-top: var(--sp-6);">
      {{ range .RegularPages.ByWeight }}
      <article class="card">
        <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
        <p>{{ .Description }}</p>
        <a href="{{ .Permalink }}" class="btn btn--sm btn--ghost">
          View Problem <i class="fas fa-arrow-right"></i>
        </a>
      </article>
      {{ end }}
    </div>
  </article>
  
  <aside class="doc__toc">
    <h4>Problems</h4>
    <nav>
      <ul class="tree">
        {{ range .RegularPages.ByWeight }}
        <li>
          <a href="{{ .Permalink }}">{{ .Title }}</a>
        </li>
        {{ end }}
      </ul>
    </nav>
  </aside>
</div>
{{ end }}
