# =============================================================================
# VFB Workshop — NeuroFly 2026
# =============================================================================

baseURL = "https://workshop.virtualflybrain.org/"
title = "VFB Self-Led Learning — NeuroFly 2026"
languageCode = "en-us"
defaultContentLanguage = "en"
theme = "vfb-nova"

enableGitInfo = false
timeZone = "Europe/London"

# GA4 property shared with VFB's other VFB3-generation tools (vfb3-mcp,
# vfb3-mcp-preview, chat.virtualflybrain.org) - see RancherServices
# vfb-services-live/docker-compose.yml GA_MEASUREMENT_ID. Note this differs
# from the classic www.virtualflybrain.org / geppetto-vfb property
# (G-K7DDZVVXM7); this one was chosen deliberately since the workshop leans
# on the VFB3 tools it's teaching (MCP, Chat). Hugo's built-in
# google_analytics.html template (wired in baseof.html) is wrapped there in
# an explicit hugo.IsProduction guard, so the gtag.js snippet only fires on
# a production build (the default for plain `hugo`/`hugo --minify`, which is
# what Dockerfile.site uses) - not on `hugo server` during local dev.
[services]
  [services.googleAnalytics]
    id = "G-QKCC1GEBQ9"

[security]
  allowContent = ['^text/html$', '^text/markdown$', '^text/x-org$', '^text/asciidoc$']

[module]
  [[module.mounts]]
    source = "content/en"
    target = "content"

[permalinks]
  sessions = "/sessions/:slug/"

[outputs]
  home = ["HTML", "JSON"]   # /index.json feeds the search palette
  section = ["HTML", "RSS"]
  page = ["HTML"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    style = "github-dark"
    noClasses = true
    lineNos = false
    tabWidth = 2

[imaging]
  resampleFilter = "CatmullRom"
  quality = 82
  anchor = "smart"

paginate = 50

[taxonomies]
  tag = "tags"
  route = "routes"

[params]
  description = "7 interactive sessions utilise material from Virtual Fly Brain. Learn how to find, bridge, and analyse neurons across datasets through 5 routes."
  tagline = "VFB Self-Led Learning — NeuroFly 2026"
  copyright = "VirtualFlyBrain.org"
  github_repo = "https://github.com/VirtualFlyBrain/neurofly2026-workshop"
  github_branch = "main"

  [params.ui]
    navbar_logo = "vfb-logo.svg"
    navbar_translucent_over_cover = false
    sidebar_menu_compact = true
    sidebar_menu_foldable = false
    breadcrumb_disable = false

[params.links]
  [[params.links.user]]
    name = "Virtual Fly Brain"
    url = "https://virtualflybrain.org"
    icon = "fa-solid fa-globe"
    desc = "Virtual Fly Brain homepage"
  [[params.links.user]]
    name = "VFB Chat"
    url = "https://chat.virtualflybrain.org"
    icon = "fa-solid fa-comments"
    desc = "Natural language interface to VFB"
  [[params.links.user]]
    name = "GitHub"
    url = "https://github.com/VirtualFlyBrain/neurofly2026-workshop"
    icon = "fa-brands fa-github"
    desc = "Site source code"
  [[params.links.user]]
    name = "NeuroFly 2026"
    url = "https://neurofly.org/y2026/"
    icon = "fa-solid fa-calendar"
    desc = "Conference homepage"

